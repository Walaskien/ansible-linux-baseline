name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: yamllint .
      - name: shellcheck
        run: shellcheck -x tests/run-in-docker.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - run: ansible-lint
      - run: ansible-playbook --syntax-check site.yml
  converge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["ubuntu:22.04", "debian:12", "rockylinux:9"]
    steps:
      - uses: actions/checkout@v7
      - run: tests/run-in-docker.sh ${{ matrix.image }}
